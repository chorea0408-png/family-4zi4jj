<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>형준 유나 신혼여행</title>

  <!-- 검색 노출 막기 -->
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#FBF8F3">

  <!-- 카카오톡 미리보기(Open Graph) -->
  <meta property="og:title" content="형준 유나 신혼여행">
  <meta property="og:description" content="형준이와 유나의 유럽 신혼여행 소식을 확인해 보세요">
  <!-- TODO(질문): og:image는 절대 주소(https://...)여야 카카오톡에 나옴. 배포 도메인과 폴더 이름을 아직 몰라서 자리표시자를 둠. 배포 주소가 정해지면 바꿔야 함. -->
  <meta property="og:image" content="https://YOUR-DOMAIN/family-k7q2xm/og-image.jpg">

  <!-- 파비콘: ✈️ 이모지 SVG -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E✈️%3C/text%3E%3C/svg%3E">

  <!-- 외부 라이브러리 3개(설계서: Pretendard, Leaflet 1.9, PapaParse 5), jsDelivr CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <h1 class="app-header__title">형준 유나 신혼여행</h1>
      <p class="app-header__sub">2026.11.10 – 12.2 · 4개국</p>
    </div>
  </header>

  <main class="app-main">
    <section id="view-today" class="view" role="tabpanel" aria-labelledby="tab-today"></section>
    <section id="view-map" class="view" role="tabpanel" aria-labelledby="tab-map" hidden></section>
    <section id="view-album" class="view" role="tabpanel" aria-labelledby="tab-album" hidden></section>
  </main>

  <nav class="tabbar">
    <div class="tabbar__inner" role="tablist">
      <button id="tab-today" class="tab" role="tab" type="button" data-tab="today" aria-controls="view-today" aria-selected="true">
        <span class="tab__icon" aria-hidden="true">☀️</span>
        <span class="tab__label">오늘</span>
      </button>
      <button id="tab-map" class="tab" role="tab" type="button" data-tab="map" aria-controls="view-map" aria-selected="false">
        <span class="tab__icon" aria-hidden="true">🗺️</span>
        <span class="tab__label">지도</span>
      </button>
      <button id="tab-album" class="tab" role="tab" type="button" data-tab="album" aria-controls="view-album" aria-selected="false">
        <span class="tab__icon" aria-hidden="true">📷</span>
        <span class="tab__label">앨범</span>
      </button>
    </div>
  </nav>

  <!-- 전역 스크립트(모듈보다 먼저 로드): Leaflet(L), PapaParse(Papa) -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
